<!DOCTYPE html>
<html>
<head><title>Debug Test</title></head>
<body>
<h1>Data Loading Test</h1>
<pre id="log"></pre>
<script>
const log = document.getElementById('log');
function addLog(msg) { log.textContent += msg + '\n'; }
addLog('Starting test...');
addLog('Current URL: ' + window.location.href);
addLog('Fetch test 1: data/posts-index.json');
fetch('data/posts-index.json?v=' + Date.now())
  .then(r => { addLog('Status: ' + r.status); return r.json(); })
  .then(d => { addLog('OK! Posts: ' + d.posts.length); })
  .catch(e => { addLog('ERROR: ' + e.message); });
</script>
</body>
</html>
